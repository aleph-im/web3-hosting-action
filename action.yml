name: 'Aleph Web3 Hosting'
description: "Deploy a website or dApp on Aleph Cloud"
author: 'Aleph Cloud'
branding:
  icon: upload-cloud
  color: blue

inputs:
  path:
    description: "Path to the static website's files (eg frontend/out)"
    required: true
  private-key:
    description: 'The private key of the Ethereum wallet used to sign the deployment'
    required: true
  owner-address:
    description: 'Address of the wallet that owns the website and pays with its credits. Requires an authorization granted to the signing wallet. Leave blank to own and pay with the signing wallet directly'
    required: false
    default: ''
  website-name:
    description: 'Identifier of the website on your Aleph account. Defaults to the repository name'
    required: false
    default: ''
  domain:
    description: 'Domain name to link to the deployed site (eg libertai.io). Ignored for pull request previews'
    required: false
    default: ''
  retention_days:
    description: "Delete previous versions of this website older than this number of days. Leave blank to keep all versions"
    required: false
    default: ""
  github-token:
    description: "Token used to detect closed pull requests and clean up their previews. Defaults to the workflow token"
    required: false
    default: ${{ github.token }}

outputs:
  url:
    value: ${{ steps.set-outputs.outputs.url }}
    description: "The deployed URL to access the website"
  cid:
    value: ${{ steps.set-outputs.outputs.cid }}
    description: "The IPFS CID (v1) of the deployed files"
  version:
    value: ${{ steps.set-outputs.outputs.version }}
    description: "The version number of the website on Aleph (empty for previews)"

runs:
  using: 'composite'
  steps:
    - name: Validate inputs and select mode
      id: mode
      shell: bash
      env:
        PRIVATE_KEY: ${{ inputs.private-key }}
      run: |
        if [[ -z "$PRIVATE_KEY" ]]; then
          echo "::error ::A private key is required. Pass the 'private-key' input."
          exit 1
        fi
        if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
          echo "preview=true" >> "$GITHUB_OUTPUT"
          # On a `closed` event (PR closed or merged) we only tear the preview
          # down - never redeploy it. This lets a workflow add `closed` to its
          # trigger types for instant teardown without recreating the preview.
          if [[ "${{ github.event.action }}" == "closed" ]]; then
            echo "cleanup_only=true" >> "$GITHUB_OUTPUT"
            echo "Mode: preview cleanup (pull request #${{ github.event.pull_request.number }} closed)"
          else
            echo "cleanup_only=false" >> "$GITHUB_OUTPUT"
            echo "Mode: preview (pull request #${{ github.event.pull_request.number }})"
          fi
        else
          echo "preview=false" >> "$GITHUB_OUTPUT"
          echo "cleanup_only=false" >> "$GITHUB_OUTPUT"
          echo "Mode: deploy"
        fi

    - name: Install the Aleph CLI
      shell: bash
      run: |
        set -euo pipefail
        ALEPH_CLI_VERSION=0.13.0
        mkdir -p "$RUNNER_TEMP/aleph-cli"
        curl -fsSL --retry 3 -o "$RUNNER_TEMP/aleph-cli/aleph" \
          "https://github.com/aleph-im/aleph-rs/releases/download/v${ALEPH_CLI_VERSION}/aleph-cli-linux-x86_64"
        chmod +x "$RUNNER_TEMP/aleph-cli/aleph"
        echo "$RUNNER_TEMP/aleph-cli" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/aleph-cli/aleph" --version

    - name: Prepare the deployment
      shell: bash
      env:
        ALEPH_PRIVATE_KEY: ${{ inputs.private-key }}
        INPUT_WEBSITE_NAME: ${{ inputs.website-name }}
        INPUT_OWNER_ADDRESS: ${{ inputs.owner-address }}
        PREVIEW: ${{ steps.mode.outputs.preview }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        export ALEPH_PRIVATE_KEY="${ALEPH_PRIVATE_KEY#0x}"

        BASE="${INPUT_WEBSITE_NAME:-${GITHUB_REPOSITORY##*/}}"
        BASE=$(echo "$BASE" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9_-]/-/g')

        if [[ "$PREVIEW" == "true" ]]; then
          WEBSITE_NAME="${BASE}-preview-pr-${PR_NUMBER}"
        else
          WEBSITE_NAME="$BASE"
        fi

        # Resolve the signer address from the private key: --dry-run signs
        # without submitting anything, and the signed message carries the
        # sender address (the CID below is an arbitrary valid placeholder).
        SIGNER=$(aleph file pin QmavALnybU8P19w8G1yhxyzWWfP6emKKPKFiaFmjXhKdYE --dry-run --chain eth --json | jq -r '.sender')

        {
          echo "WEBSITE_BASE=$BASE"
          echo "WEBSITE_NAME=$WEBSITE_NAME"
          echo "SIGNER_ADDRESS=$SIGNER"
          echo "OWNER_ADDRESS=$INPUT_OWNER_ADDRESS"
          echo "BILLING_ADDRESS=${INPUT_OWNER_ADDRESS:-$SIGNER}"
        } >> "$GITHUB_ENV"

        echo "Website: $WEBSITE_NAME | Signer: $SIGNER | Owner: ${INPUT_OWNER_ADDRESS:-$SIGNER}"

    - name: Check authorization and credits
      shell: bash
      env:
        ALEPH_PRIVATE_KEY: ${{ inputs.private-key }}
        CLEANUP_ONLY: ${{ steps.mode.outputs.cleanup_only }}
      run: |
        set -euo pipefail
        export ALEPH_PRIVATE_KEY="${ALEPH_PRIVATE_KEY#0x}"

        if [[ -n "$OWNER_ADDRESS" ]]; then
          AUTH_COUNT=$(aleph authorization received --granter "$OWNER_ADDRESS" --chain eth --json | jq 'length')
          if [[ "$AUTH_COUNT" -eq 0 ]]; then
            echo "::error ::Wallet $SIGNER_ADDRESS has no authorization from $OWNER_ADDRESS. The owner must run: aleph authorization add $SIGNER_ADDRESS --message-types store,aggregate --aggregate-keys websites,domains --channels ALEPH-CLOUDSOLUTIONS"
            exit 1
          fi
        fi

        # Tearing a preview down does not cost credits, and you may be cleaning
        # up precisely because the wallet ran dry - so skip the credit check.
        if [[ "$CLEANUP_ONLY" == "true" ]]; then
          echo "Cleanup-only run: skipping the credit check"
          exit 0
        fi

        CREDITS=$(aleph account balance "$BILLING_ADDRESS" --json | jq -r '.credits // 0 | floor')
        if [[ "$CREDITS" -le 0 ]]; then
          echo "::error ::$BILLING_ADDRESS has no Aleph credits, the deployment would be garbage-collected within ~24 hours. Buy credits with 'aleph credit buy' or on the Aleph Cloud console."
          exit 1
        fi
        echo "Billing address $BILLING_ADDRESS holds $CREDITS credits"

    # ----- Preview flow (pull requests) -----

    - name: Clean up previews of closed pull requests
      if: ${{ steps.mode.outputs.preview == 'true' }}
      shell: bash
      env:
        ALEPH_PRIVATE_KEY: ${{ inputs.private-key }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        export ALEPH_PRIVATE_KEY="${ALEPH_PRIVATE_KEY#0x}"
        OBO=()
        [[ -n "$OWNER_ADDRESS" ]] && OBO=(--on-behalf-of "$OWNER_ADDRESS")

        # List this repository's preview websites and drop the ones whose
        # pull request is closed, releasing their file pins so they stop
        # consuming credits. This runs on every pull request event, so closed
        # previews are reaped by later PR activity even without a `closed`
        # trigger; adding `closed` to the workflow's trigger types makes the
        # teardown happen immediately (this step still runs, the deploy steps
        # below are skipped).
        SITES=$(aleph website list --address "$BILLING_ADDRESS" --json \
          | jq -r --arg b "$WEBSITE_BASE" '.[] | select(.name | test("^" + $b + "-preview-pr-[0-9]+$")) | .name')

        for SITE in $SITES; do
          PR="${SITE##*-pr-}"
          STATE=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '.state' 2>/dev/null || echo "")
          if [[ "$STATE" != "closed" ]]; then
            continue
          fi
          echo "🧹 Reaping preview for closed PR #$PR ($SITE)"
          REAP=$(mktemp)
          aleph website show "$SITE" --address "$BILLING_ADDRESS" --json > "$REAP" || continue
          VOLS=$( { jq -r '.volume_id // empty' "$REAP"; jq -r '.history // {} | to_entries[].value' "$REAP"; } | sort -u | tr '\n' ' ')
          if [[ -n "${VOLS// /}" ]]; then
            # shellcheck disable=SC2086
            aleph message forget $VOLS --reason "preview cleanup (PR #$PR closed)" --yes --chain eth "${OBO[@]}" \
              || echo "⚠️ Could not forget files for $SITE"
          fi
          aleph website delete "$SITE" --yes --chain eth "${OBO[@]}" \
            || echo "⚠️ Could not delete website entry $SITE"
        done

    - name: Deploy the preview
      if: ${{ steps.mode.outputs.preview == 'true' && steps.mode.outputs.cleanup_only != 'true' }}
      shell: bash
      env:
        ALEPH_PRIVATE_KEY: ${{ inputs.private-key }}
        SITE_PATH: ${{ inputs.path }}
      run: |
        set -euo pipefail
        export ALEPH_PRIVATE_KEY="${ALEPH_PRIVATE_KEY#0x}"
        OBO=()
        [[ -n "$OWNER_ADDRESS" ]] && OBO=(--on-behalf-of "$OWNER_ADDRESS")

        OUT=$(mktemp)
        if aleph website show "$WEBSITE_NAME" --address "$BILLING_ADDRESS" --json > /dev/null 2>&1; then
          echo "Updating preview '$WEBSITE_NAME'..."
          aleph website update "$WEBSITE_NAME" "$SITE_PATH" --payment-type credit --chain eth --json "${OBO[@]}" > "$OUT"
        else
          echo "Creating preview '$WEBSITE_NAME'..."
          aleph website deploy "$WEBSITE_NAME" "$SITE_PATH" --payment-type credit --chain eth --json "${OBO[@]}" > "$OUT"
        fi
        cat "$OUT"
        NEW_VOLUME=$(jq -r '.volume_id // .new_volume_id' "$OUT")
        echo "IPFS_CID=$(jq -r '.ipfs_cid' "$OUT")" >> "$GITHUB_ENV"

        # Keep only the latest preview version: forget every superseded volume
        # so an open PR never costs more than one pinned file. The current
        # volume is stored in `.volume_id`, never in `.history`, but exclude it
        # explicitly so a fresh deploy can never forget its own files.
        STALE=$(aleph website show "$WEBSITE_NAME" --address "$BILLING_ADDRESS" --json \
          | jq -r --arg cur "$NEW_VOLUME" '.history // {} | to_entries[].value | select(. != $cur)' | sort -u | tr '\n' ' ')
        if [[ -n "${STALE// /}" ]]; then
          # shellcheck disable=SC2086
          aleph message forget $STALE --reason "preview superseded" --yes --chain eth "${OBO[@]}" \
            || echo "⚠️ Could not forget superseded preview files"
        fi

    - name: Find existing PR comment
      if: ${{ steps.mode.outputs.preview == 'true' && steps.mode.outputs.cleanup_only != 'true' }}
      uses: peter-evans/find-comment@v4
      id: fc
      with:
        issue-number: ${{ github.event.pull_request.number }}
        comment-author: 'github-actions[bot]'
        body-includes: Deployed on

    - name: Comment the preview link on the PR
      if: ${{ steps.mode.outputs.preview == 'true' && steps.mode.outputs.cleanup_only != 'true' }}
      uses: peter-evans/create-or-update-comment@v5
      with:
        comment-id: ${{ steps.fc.outputs.comment-id }}
        issue-number: ${{ github.event.pull_request.number }}
        body: |
          Deployed on:
          - https://${{ env.IPFS_CID }}.ipfs.aleph.sh

          > Preview for this pull request, updated on every commit and removed once the PR is closed.
        edit-mode: replace
      continue-on-error: true

    # ----- Deploy flow (outside of pull requests) -----

    - name: Deploy the website
      if: ${{ steps.mode.outputs.preview == 'false' }}
      shell: bash
      env:
        ALEPH_PRIVATE_KEY: ${{ inputs.private-key }}
        SITE_PATH: ${{ inputs.path }}
      run: |
        set -euo pipefail
        export ALEPH_PRIVATE_KEY="${ALEPH_PRIVATE_KEY#0x}"
        OBO=()
        [[ -n "$OWNER_ADDRESS" ]] && OBO=(--on-behalf-of "$OWNER_ADDRESS")

        OUT=$(mktemp)
        if aleph website show "$WEBSITE_NAME" --address "$BILLING_ADDRESS" --json > /dev/null 2>&1; then
          echo "Updating existing website '$WEBSITE_NAME'..."
          aleph website update "$WEBSITE_NAME" "$SITE_PATH" --payment-type credit --chain eth --json "${OBO[@]}" > "$OUT"
        else
          echo "Deploying new website '$WEBSITE_NAME'..."
          aleph website deploy "$WEBSITE_NAME" "$SITE_PATH" --payment-type credit --chain eth --json "${OBO[@]}" > "$OUT"
        fi
        cat "$OUT"

        {
          echo "IPFS_CID=$(jq -r '.ipfs_cid' "$OUT")"
          echo "VOLUME_ID=$(jq -r '.volume_id // .new_volume_id' "$OUT")"
          echo "WEBSITE_VERSION=$(jq -r '.version' "$OUT")"
        } >> "$GITHUB_ENV"

    - name: Link the domain
      if: ${{ steps.mode.outputs.preview == 'false' && inputs.domain != '' }}
      shell: bash
      env:
        ALEPH_PRIVATE_KEY: ${{ inputs.private-key }}
        DOMAIN: ${{ inputs.domain }}
      run: |
        set -euo pipefail
        export ALEPH_PRIVATE_KEY="${ALEPH_PRIVATE_KEY#0x}"
        OBO=()
        [[ -n "$OWNER_ADDRESS" ]] && OBO=(--on-behalf-of "$OWNER_ADDRESS")

        if aleph domain list --address "$BILLING_ADDRESS" --json | jq -e --arg d "$DOMAIN" 'any(.[]; .domain == $d)' > /dev/null; then
          echo "Re-pointing existing domain $DOMAIN to '$WEBSITE_NAME'..."
          aleph domain attach "$DOMAIN" --to "$WEBSITE_NAME" --chain eth --json "${OBO[@]}"
        else
          echo "Adding new domain $DOMAIN..."
          aleph domain add "$DOMAIN" --target "$WEBSITE_NAME" --kind ipfs --chain eth --json "${OBO[@]}"
          echo "::notice ::Domain $DOMAIN linked. If not done yet, configure these DNS records: CNAME $DOMAIN -> ipfs.public.aleph.sh | CNAME _dnslink.$DOMAIN -> _dnslink.$DOMAIN.static.public.aleph.sh | TXT _control.$DOMAIN -> $BILLING_ADDRESS"
        fi

    - name: Delete versions older than the retention period
      if: ${{ steps.mode.outputs.preview == 'false' && inputs.retention_days != '' }}
      shell: bash
      env:
        ALEPH_PRIVATE_KEY: ${{ inputs.private-key }}
        RETENTION_DAYS: ${{ inputs.retention_days }}
      run: |
        set -euo pipefail
        export ALEPH_PRIVATE_KEY="${ALEPH_PRIVATE_KEY#0x}"
        OBO=()
        [[ -n "$OWNER_ADDRESS" ]] && OBO=(--on-behalf-of "$OWNER_ADDRESS")

        THRESHOLD=$(( $(date +%s) - RETENTION_DAYS * 86400 ))
        echo "Deleting versions of '$WEBSITE_NAME' created before $(date -u -d "@$THRESHOLD" +"%Y-%m-%dT%H:%M:%SZ")..."

        HISTORY=$(aleph website show "$WEBSITE_NAME" --address "$BILLING_ADDRESS" --json | jq -r '.history // {} | to_entries[].value')
        if [[ -z "$HISTORY" ]]; then
          echo "No previous versions to clean up"
          exit 0
        fi

        for VOLUME in $HISTORY; do
          MSG=$(mktemp)
          if ! curl -fsSL "https://api2.aleph.im/api/v0/messages/$VOLUME" -o "$MSG"; then
            echo "⚠️ Could not fetch message $VOLUME, skipping"
            continue
          fi
          STATUS=$(jq -r '.status // empty' "$MSG")
          CREATED=$(jq -r '.message.time // empty' "$MSG")

          if [[ "$STATUS" != "processed" || -z "$CREATED" ]]; then
            echo "Skipping $VOLUME (status: ${STATUS:-unknown})"
            continue
          fi

          if (( ${CREATED%.*} < THRESHOLD )); then
            echo "🗑️ Deleting stale version $VOLUME"
            aleph message forget "$VOLUME" --reason "web3-hosting-action retention" --yes --chain eth "${OBO[@]}" \
              || echo "⚠️ Could not forget $VOLUME (already deleted?)"
          else
            echo "✅ Keeping version $VOLUME"
          fi
        done

    # ----- Common -----

    - name: Set outputs
      id: set-outputs
      # Nothing is deployed on a cleanup-only run, so there are no outputs to set.
      if: ${{ steps.mode.outputs.cleanup_only != 'true' }}
      shell: bash
      env:
        DOMAIN: ${{ inputs.domain }}
        PREVIEW: ${{ steps.mode.outputs.preview }}
      run: |
        set -euo pipefail
        if [[ -n "$DOMAIN" && "$PREVIEW" == "false" ]]; then
          URL="https://$DOMAIN"
        else
          URL="https://${IPFS_CID}.ipfs.aleph.sh"
        fi

        {
          echo "url=$URL"
          echo "cid=${IPFS_CID}"
          echo "version=${WEBSITE_VERSION:-}"
        } >> "$GITHUB_OUTPUT"

        {
          echo "### Deployed on Aleph Cloud 🚀"
          echo ""
          echo "| | |"
          echo "|---|---|"
          echo "| **URL** | $URL |"
          echo "| **IPFS CID** | \`${IPFS_CID}\` |"
          if [[ -n "${WEBSITE_VERSION:-}" ]]; then
            echo "| **Version** | ${WEBSITE_VERSION} |"
          fi
          if [[ "$PREVIEW" == "true" ]]; then
            echo ""
            echo "> Pull request preview."
          fi
        } >> "$GITHUB_STEP_SUMMARY"
